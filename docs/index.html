<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CC 学习成就地图</title>
<meta name="description" content="Anthropic 与 OpenAI 官方课程学习旅程的星空可视化：知识点是星星，课程是星座，项目是行星。非官方学习项目。">
<!-- 热力图读这个用户的 GitHub 贡献；fork 后改成自己的用户名 -->
<meta name="github-user" content="XingZengJi">
<!-- 分享卡片：贴链接到社交平台时显示的标题、简介和预览图（图片必须是绝对地址） -->
<meta property="og:type" content="website">
<meta property="og:title" content="CC 学习成就地图">
<meta property="og:description" content="Anthropic 与 OpenAI 官方课程的星空学习地图：25 门课、201 个知识点、769 道测验题，答对测验点亮星星。">
<meta property="og:url" content="https://xingzengji.github.io/ai-learn/">
<meta property="og:image" content="https://xingzengji.github.io/ai-learn/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://xingzengji.github.io/ai-learn/og-image.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌌</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 视图条：现在看的是谁的星图（我的 / 作者的 / 别人分享的），内容由 app.js 填 -->
<div id="view-bar" class="view-bar">
  <span id="view-bar-text"></span>
  <span id="view-bar-actions" class="view-bar-actions"></span>
</div>

<header class="site-header">
  <button id="switch-provider" class="switch-btn" type="button"></button>
  <p class="eyebrow" id="eyebrow">ANTHROPIC SKILLJAR · 2026</p>
  <h1 id="site-title">CC 学习成就地图</h1>
  <p class="subtitle">知识点是星星，课程是星座，项目是行星 —— 学完一个，点亮一颗。</p>
  <p class="progress-line">
    <span class="mono" id="stat-stars">— / — 颗星已点亮</span>
    <span class="sep">·</span>
    <span class="mono" id="stat-courses">— / — 门课完成</span>
    <span class="sep" id="stat-projects-sep">·</span>
    <span class="mono" id="stat-projects">— / — 个项目达成</span>
  </p>
</header>

<nav class="tabs" role="tablist" aria-label="视图切换">
  <button role="tab" aria-selected="true" aria-controls="view-starmap" id="tab-starmap" type="button">✦ 星图</button>
  <button role="tab" aria-selected="false" aria-controls="view-projects" id="tab-projects" type="button">◉ 项目</button>
  <button role="tab" aria-selected="false" aria-controls="view-list" id="tab-list" type="button">☰ 列表</button>
</nav>

<main>
  <section id="view-starmap" role="tabpanel" aria-labelledby="tab-starmap">
    <div class="starmap-wrap">
      <svg id="starmap" viewBox="0 0 1200 980" role="img" aria-label="课程星图：按三个梯队分区的知识点星座"></svg>
    </div>
    <p class="map-legend">
      <span class="lg"><span class="dot done t1"></span>已点亮</span>
      <span class="lg"><span class="dot todo"></span>未点亮</span>
      <span class="lg hint">点击星星查看知识点，答对测验即可点亮</span>
    </p>
  </section>

  <section id="view-projects" role="tabpanel" aria-labelledby="tab-projects" hidden>
    <div id="projects-track" class="projects-track"></div>
  </section>

  <section id="view-list" role="tabpanel" aria-labelledby="tab-list" hidden>
    <div id="list-root" class="list-root"></div>
  </section>
</main>

<section class="heatmap-panel">
  <h2>学习足迹 · GitHub 贡献</h2>
  <p class="mono" id="heatmap-total">正在读取 GitHub 贡献数据…</p>
  <div class="heatmap-scroll">
    <div id="heatmap"></div>
  </div>
</section>

<footer class="site-footer">
  <a href="https://github.com/XingZengJi/ai-learn">学习仓库</a>
  <span id="plan-link-wrap"><span class="sep">·</span><a href="https://github.com/XingZengJi/ai-learn/blob/main/%E5%AD%A6%E4%B9%A0%E8%AE%A1%E5%88%92.md">学习计划</a></span>
  <span class="sep">·</span>
  <a href="https://anthropic.skilljar.com/" id="source-link">Anthropic 课程</a>
  <p class="footer-note">非官方学习项目，与 Anthropic、OpenAI 无隶属关系。课程内容版权归原作者所有。</p>
</footer>

<div id="k-modal" class="k-modal" hidden>
  <div class="k-modal-backdrop"></div>
  <div class="k-modal-box" role="dialog" aria-modal="true" aria-labelledby="k-modal-title">
    <button class="k-modal-close" type="button" aria-label="关闭">×</button>
    <div class="k-modal-body"></div>
  </div>
</div>

<!-- 分享弹窗：复用知识点弹窗的外壳样式，内容由 share.js 填 -->
<div id="share-modal" class="k-modal" hidden>
  <div class="k-modal-backdrop"></div>
  <div class="k-modal-box" role="dialog" aria-modal="true" aria-labelledby="share-modal-title">
    <button class="k-modal-close" type="button" aria-label="关闭">×</button>
    <div class="k-modal-body"></div>
  </div>
</div>

<div id="tooltip" class="tooltip" hidden></div>

<script src="js/starmap.js"></script>
<script src="js/quiz.js"></script>
<script src="js/heatmap.js"></script>
<script src="js/share.js"></script>
<script src="js/app.js"></script>
</body>
</html>
